name: Build and test TeluguTutor Android APK

on:
  push:
    branches: [ main ]
    paths:
      - '.payload/beta3/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore exact Android source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/beta3/part-*.b64 | base64 --decode > "$RUNNER_TEMP/telugututor-android.tar.gz"
          tar -tzf "$RUNNER_TEMP/telugututor-android.tar.gz" >/dev/null
          tar -xzf "$RUNNER_TEMP/telugututor-android.tar.gz" -C "$GITHUB_WORKSPACE"
          test -f TeluguTutor-Android/app/build.gradle.kts
          grep -q 'versionName = "1.2.0-beta3"' TeluguTutor-Android/app/build.gradle.kts

      - name: Download and verify bundled Vosk English model
        shell: bash
        run: |
          set -euo pipefail
          MODEL_URL="https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip"
          MODEL_SHA256="30f26242c4eb449f948e42cb302dd7a686cb29a3423a8367f99ff41780942498"
          mkdir -p TeluguTutor-Android/app/src/main/assets
          curl --retry 3 --retry-delay 2 --fail --location "$MODEL_URL" -o "$RUNNER_TEMP/vosk-model-small-en-us-0.15.zip"
          echo "$MODEL_SHA256  $RUNNER_TEMP/vosk-model-small-en-us-0.15.zip" | sha256sum --check
          cp "$RUNNER_TEMP/vosk-model-small-en-us-0.15.zip" TeluguTutor-Android/app/src/main/assets/vosk-model-small-en-us-0.15.zip
          test -s TeluguTutor-Android/app/src/main/assets/vosk-model-small-en-us-0.15.zip

      - name: Build debug APK
        run: gradle --no-daemon -p TeluguTutor-Android assembleDebug --stacktrace

      - name: Run emulator integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: gradle --no-daemon -p TeluguTutor-Android connectedDebugAndroidTest --stacktrace

      - name: Verify APK contents and write checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="TeluguTutor-Android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libvosk.so'
          unzip -l "$APK" | grep -q 'lib/x86_64/libvosk.so'
          unzip -l "$APK" | grep -q 'assets/vosk-model-small-en-us-0.15.zip'
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload installable APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: TeluguTutor-Mobile-1.2.0-beta3-APK
          path: |
            TeluguTutor-Android/app/build/outputs/apk/debug/app-debug.apk
            TeluguTutor-Android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
