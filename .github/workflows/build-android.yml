name: Build TeluguTutor Android APK

on:
  push:
    branches: [ main ]
    paths:
      - '.payload/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore Android project archive
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/part-*.b64 | base64 --decode > "$RUNNER_TEMP/telugututor-android.tar.gz"
          mkdir -p "$RUNNER_TEMP/check"
          tar -tzf "$RUNNER_TEMP/telugututor-android.tar.gz" >/dev/null
          tar -xzf "$RUNNER_TEMP/telugututor-android.tar.gz" -C "$GITHUB_WORKSPACE"
          test -f TeluguTutor-Android/app/build.gradle.kts
          test -f TeluguTutor-Android/app/src/main/AndroidManifest.xml

      - name: Build Android debug APK
        run: gradle --no-daemon -p TeluguTutor-Android assembleDebug --stacktrace

      - name: Verify APK output
        run: |
          test -s TeluguTutor-Android/app/build/outputs/apk/debug/app-debug.apk
          file TeluguTutor-Android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TeluguTutor-Mobile-debug-APK
          path: TeluguTutor-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
